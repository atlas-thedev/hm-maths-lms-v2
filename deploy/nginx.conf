# /etc/nginx/sites-available/hm-maths
# Four app instances (hm-maths@3100 … @3103), one per CPU core. least_conn sends each request to the least busy one;
# a stopped instance is skipped for 5 s, so a rolling restart (deploy/update.sh) drops no requests.
upstream hm_next {
  least_conn;
  server 127.0.0.1:3100 max_fails=2 fail_timeout=5s;
  server 127.0.0.1:3101 max_fails=2 fail_timeout=5s;
  server 127.0.0.1:3102 max_fails=2 fail_timeout=5s;
  server 127.0.0.1:3103 max_fails=2 fail_timeout=5s;
  keepalive 64;
}

server {
  listen 80;
  listen [::]:80;
  server_name hm.nativelaunch.xyz;
  location / { return 301 https://hm.nativelaunch.xyz$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name hm.nativelaunch.xyz;

  ssl_certificate /etc/letsencrypt/live/hm.nativelaunch.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/hm.nativelaunch.xyz/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:HmTLS:10m;
  ssl_session_timeout 1d;

  include /etc/nginx/snippets/cloudflare-realip.conf;

  client_max_body_size 60m;          # tute PDFs up to 50 MB
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://hm_next;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_next_upstream error timeout http_502 http_503;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://hm_next;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
    # If an instance is down or restarting, try another one (GET / HEAD only: nginx never replays a POST).
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
  }
}
