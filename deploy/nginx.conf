# /etc/nginx/sites-available/hm-maths
upstream hm_next { server 127.0.0.1:3000; keepalive 32; }

server {
  listen 80;
  listen [::]:80;
  server_name hm.nativelaunch.xyz 3.106.132.147;

  # Behind Cloudflare: take the visitor's IP from CF-Connecting-IP (trusted only from Cloudflare's
  # ranges), so $remote_addr / X-Real-IP is the real student and per-IP rate limits work.
  # Install: sudo cp deploy/cloudflare-realip.conf /etc/nginx/snippets/cloudflare-realip.conf
  include /etc/nginx/snippets/cloudflare-realip.conf;

  client_max_body_size 60m;          # tute PDFs up to 50 MB
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  location /_next/static/ {
    proxy_pass http://hm_next;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://hm_next;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_read_timeout 120s;
  }
}
