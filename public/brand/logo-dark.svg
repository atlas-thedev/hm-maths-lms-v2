<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HM Maths Logo Dark">
  <defs>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#FFD45A"/>
      <stop offset="100%" stop-color="#E5A61E"/>
    </linearGradient>
    <linearGradient id="navyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3866"/>
      <stop offset="50%" stop-color="#0E203B"/>
      <stop offset="100%" stop-color="#050C17"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="tileGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="4.5" flood-color="#E8B84A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="url(#navyDark)" filter="url(#tileGlow)"/>
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="#FFD868" stroke-width="1.4" stroke-opacity="0.8"/>
  <g fill="none" stroke="url(#goldDark)" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#goldGlow)">
    <path d="M16.5 18.5v27"/>
    <path d="M31 18.5v27"/>
    <path d="M16.5 32.5h14.5"/>
    <path d="M31 18.5l8.5 20.5 8.5-20.5"/>
    <path d="M48 18.5v27"/>
  </g>
  <circle cx="50.3" cy="12.9" r="2.6" fill="url(#goldDark)" filter="url(#goldGlow)"/>
</svg>
