<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HM Maths Logo">
  <defs>
    <style>
      .navy-bg { fill: url(#navyLight); }
      .gold-stroke { stroke: url(#goldLight); }
      .gold-fill { fill: url(#goldLight); }
      .border-stroke { stroke: #DDA838; stroke-opacity: 0.55; stroke-width: 1.2px; }
      @media (prefers-color-scheme: dark) {
        .navy-bg { fill: url(#navyDark); filter: drop-shadow(0 0 4px rgba(232, 184, 74, 0.35)); }
        .gold-stroke { stroke: url(#goldDark); }
        .gold-fill { fill: url(#goldDark); }
        .border-stroke { stroke: #FFD868; stroke-opacity: 0.8; stroke-width: 1.4px; }
      }
    </style>
    <!-- Light mode gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D280"/>
      <stop offset="50%" stop-color="#E2B042"/>
      <stop offset="100%" stop-color="#BD861B"/>
    </linearGradient>
    <linearGradient id="navyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C52"/>
      <stop offset="60%" stop-color="#0E213D"/>
      <stop offset="100%" stop-color="#081426"/>
    </linearGradient>
    <!-- Dark mode gradients -->
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#FFD45A"/>
      <stop offset="100%" stop-color="#E5A61E"/>
    </linearGradient>
    <linearGradient id="navyDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3866"/>
      <stop offset="50%" stop-color="#0E203B"/>
      <stop offset="100%" stop-color="#050C17"/>
    </linearGradient>
  </defs>
  <rect class="navy-bg" width="64" height="64" rx="16"/>
  <rect class="border-stroke" x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none"/>
  <g class="gold-stroke" fill="none" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16.5 18.5v27"/>
    <path d="M31 18.5v27"/>
    <path d="M16.5 32.5h14.5"/>
    <path d="M31 18.5l8.5 20.5 8.5-20.5"/>
    <path d="M48 18.5v27"/>
  </g>
  <circle class="gold-fill" cx="50.3" cy="12.9" r="2.5"/>
</svg>
